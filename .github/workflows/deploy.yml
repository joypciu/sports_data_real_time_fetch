name: Deploy Sports Data Pipeline to VPS

on:
  push:
    branches:
      - main # Deploy on push to main
  pull_request:
    branches:
      - main # Validate only on PRs targeting main
  workflow_dispatch: # Allow manual trigger

jobs:
  # ─────────────────────────────────────────────
  # Syntax check + automated tests (every PR)
  # ─────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Check Python syntax (all scripts)
        run: |
          echo "=== Syntax check ==="
          python -m py_compile \
            build_db.py \
            daily_ingest.py \
            fetch_matches.py \
            enrich_players.py \
            enrich_flashscore.py \
            realtime_monitor.py \
            stats_api.py
          echo "✅ All files passed syntax check"

      - name: Run unit tests
        run: |
          echo "=== Running test suite ==="
          pytest tests/test_suite.py -v --tb=short
          echo "✅ All tests passed"

  # ─────────────────────────────────────────────
  # Deploy — only on pushes to main
  # ─────────────────────────────────────────────
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 5m
          script: |
            set -e
            cd /home/ubuntu/services/sports-stats-api

            # Pull latest code
            git fetch origin
            git reset --hard origin/main

            # Run deploy script (venv, deps, systemd units)
            chmod +x deploy.sh
            ./deploy.sh

            echo "=== Service status ==="
            sudo systemctl status sports-stats-api --no-pager || true
            echo "✅ Deployment completed"

      - name: Post-deploy smoke test
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 30s
          command_timeout: 1m
          script: |
            set -e
            echo "=== Smoke test: GET http://localhost:8001/health ==="
            RESPONSE=$(curl -sf "http://localhost:8001/health")
            echo "Response: $RESPONSE"
            STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))")
            if [ "$STATUS" != "ok" ]; then
              echo "❌ Health check returned unexpected status: $STATUS"
              exit 1
            fi
            echo "✅ Smoke test passed"

      - name: Notify on smoke test failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_SENDER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.ADMIN_EMAIL }}
          from: Sports Data CI <${{ secrets.GMAIL_SENDER }}>
          subject: "🚨 Deploy/Smoke Test FAILED — realtime_data_fetch (${{ github.ref_name }})"
          body: |
            The post-deploy smoke test for realtime_data_fetch failed.

            Repository   : ${{ github.repository }}
            Branch       : ${{ github.ref_name }}
            Commit       : ${{ github.sha }}
            Triggered by : ${{ github.actor }}

            View the full run log:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Fix the issue and push again to trigger a new deployment.
